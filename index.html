<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy AI</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: linear-gradient(135deg, #e0c3fc, #8ec5fc); height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .header { display: flex; justify-content: space-between; padding: 15px; align-items: center; }
        .chat-area { flex: 1; padding: 20px; text-align: center; color: #333; }
        .input-bar { padding: 15px; background: rgba(255,255,255,0.8); border-radius: 30px; margin: 15px; display: flex; align-items: center; }
        input { border: none; background: transparent; width: 100%; outline: none; padding: 5px 10px; font-size: 16px; }
        .btn-upgrade { background: #ffd700; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Happy AI</h2>
        <button class="btn-upgrade">Upgrade</button>
    </div>
    <div class="chat-area">
        <h3>Ask Happy AI anything...</h3>
    </div>
    <div class="input-bar">
        <input type="text" placeholder="Type a message or prompt...">
    </div>
</body>
      </html>
